name: Rebuild reviewed course report

on:
  push:
    branches:
      - fix/reproduction-audit-2026-11-04
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install document dependency
        run: python -m pip install 'python-docx>=1.1,<2'
      - name: Validate saved benchmark data
        run: python src/check_results.py
      - name: Rebuild Word report from results
        run: python report/write_report.py
      - name: Ensure report has expected sections
        run: |
          python - <<'PY'
          from docx import Document
          document = Document('课程报告.docx')
          text = '\n'.join(p.text for p in document.paragraphs)
          for expected in ('第一章', '第二章', 'Qwen3.7', '21.6%', 'temperature=0'):
              if expected not in text:
                  raise SystemExit(f'Missing report content: {expected}')
          print('Report generated with', len(document.paragraphs), 'paragraphs and', len(document.tables), 'tables')
          PY
      - name: Commit refreshed Word document to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '课程报告.docx'
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate reviewed Word course report"
            git push
          fi
